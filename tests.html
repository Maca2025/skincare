<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tests · pure.js</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background:#F4EFE8; color:#2A2420; padding:24px; max-width:760px; margin:0 auto; }
  h1 { font-size:20px; margin-bottom:4px; }
  h2 { font-size:14px; color:#7A5A5A; margin:28px 0 8px; text-transform:uppercase; letter-spacing:1px; }
  #summary { font-size:16px; font-weight:800; padding:10px 14px; border-radius:10px; margin:12px 0 20px; }
  #summary.ok { background:#EAF5EA; color:#287848; }
  #summary.fail { background:#FBE9E7; color:#C43020; }
  .row { display:flex; gap:10px; padding:6px 10px; border-radius:8px; font-size:13px; align-items:flex-start; }
  .row.pass { background:#F3F9F3; }
  .row.fail { background:#FDEEEC; }
  .icon { flex-shrink:0; }
  .row.pass .icon { color:#287848; }
  .row.fail .icon { color:#C43020; }
  .name { flex:1; }
  .detail { color:#A09090; font-size:11.5px; margin-top:2px; }
</style>
</head>
<body>

<h1>🧪 Tests · pure.js</h1>
<div>Abrir esta página en el navegador después de cualquier cambio en <code>pure.js</code> (Regla 6 de ARQUITECTURA.md).</div>
<div id="summary"></div>
<div id="results"></div>

<!-- Solo pure.js: esta página prueba funciones puras, sin Supabase ni DOM de la app real. -->
<script src="pure.js"></script>
<script>
let _pass = 0, _fail = 0;
const _results = document.getElementById('results');
let _currentGroup = null;

function group(title) {
  _currentGroup = document.createElement('h2');
  _currentGroup.textContent = title;
  _results.appendChild(_currentGroup);
}

function t(name, actual, expected) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  if (ok) _pass++; else _fail++;
  const row = document.createElement('div');
  row.className = 'row ' + (ok ? 'pass' : 'fail');
  row.innerHTML = `<span class="icon">${ok ? '✅' : '❌'}</span>
    <div class="name">${name}${ok ? '' : `<div class="detail">actual: ${JSON.stringify(actual)} — esperado: ${JSON.stringify(expected)}</div>`}</div>`;
  _results.appendChild(row);
}

function finish() {
  const summary = document.getElementById('summary');
  summary.className = _fail === 0 ? 'ok' : 'fail';
  summary.textContent = _fail === 0
    ? `✅ Todo pasa — ${_pass}/${_pass} casos`
    : `❌ ${_fail} fallo(s) de ${_pass + _fail} casos`;
}
</script>

<script>
// ============================================================================
// FECHAS
// ============================================================================
group('📅 Fechas');

t('toDateStr: formatea fecha local sin corrimiento a UTC',
  toDateStr(new Date(2026, 0, 5)), '2026-01-05');

t('localDateOfISO: convierte instante UTC a fecha local (mediodía UTC, segura en cualquier huso)',
  localDateOfISO('2026-01-05T12:00:00Z'), '2026-01-05');

t('eachDateStr: itera inclusive los 3 días del rango',
  (() => { const out = []; eachDateStr('2026-01-01', '2026-01-03', ds => out.push(ds)); return out; })(),
  ['2026-01-01', '2026-01-02', '2026-01-03']);

t('eachDateStr: rango invertido (a > b) no itera nada',
  (() => { const out = []; eachDateStr('2026-01-05', '2026-01-01', ds => out.push(ds)); return out; })(),
  []);

t('eachDateStr: día de la semana — lunes 2026-01-05 es dow=1 (getUTCDay)',
  (() => { let d; eachDateStr('2026-01-05', '2026-01-05', (ds, dow) => d = dow); return d; })(),
  1);

// ============================================================================
// ESCAPING (regla 2 de ARQUITECTURA: sin esto, un nombre de producto es XSS)
// ============================================================================
group('🔒 Escaping');

t('esc: escapa tags HTML', esc('<b>hola</b>'), '&lt;b&gt;hola&lt;/b&gt;');
t('esc: null se vuelve string vacío', esc(null), '');
t('esc: escapa comillas simples', esc("O'Reilly"), 'O&#39;Reilly');
t('esc: producto malicioso tipo XSS queda inerte',
  esc('<img src=x onerror=alert(1)>'),
  '&lt;img src=x onerror=alert(1)&gt;');

t('fmtRich: convierte saltos de línea a <br>',
  fmtRich('linea1\nlinea2'), 'linea1<br>linea2');

t('cssSafe: solo deja letras, números, guion y guion bajo',
  cssSafe('abc 123!@#_-'), 'abc123_-');

t('jsAttrEsc: escapa backslash y comilla para uso dentro de onclick',
  jsAttrEsc("it's a \\test"), 'it\\&#39;s a \\\\test');

// ============================================================================
// tagsOf — normaliza products.tags (a veces string crudo por import CSV/Excel)
// ============================================================================
group('🏷️ tagsOf');

t('tagsOf: parsea string JSON crudo',
  tagsOf({ tags: '[{"cls":"pa4"}]' }), [{ cls: 'pa4' }]);
t('tagsOf: arreglo real pasa igual',
  tagsOf({ tags: [{ cls: 'pa4' }] }), [{ cls: 'pa4' }]);
t('tagsOf: JSON inválido devuelve arreglo vacío (no truena)',
  tagsOf({ tags: 'no es json' }), []);
t('tagsOf: sin campo tags devuelve arreglo vacío',
  tagsOf({}), []);

// ============================================================================
// adherenceFromDoneDates
// ============================================================================
group('📋 adherenceFromDoneDates');

t('adherencia: diaria (scheduleDays null), 2 de 3 días',
  adherenceFromDoneDates(new Set(['2026-01-01', '2026-01-02']), null, '2026-01-01', '2026-01-03'),
  { pct: 67, hit: 2, elig: 3, start: '2026-01-01' });

t('adherencia: con schedule_days (lun/mié/vie), cuenta solo esos días',
  adherenceFromDoneDates(new Set(['2026-01-05', '2026-01-07']), [1, 3, 5], '2026-01-05', '2026-01-11'),
  { pct: 67, hit: 2, elig: 3, start: '2026-01-05' });

t('adherencia: la ventana empieza en el primer registro, no antes (no castiga el tiempo previo)',
  adherenceFromDoneDates(new Set(['2026-01-07']), null, '2026-01-01', '2026-01-10'),
  { pct: 25, hit: 1, elig: 4, start: '2026-01-07' });

t('adherencia: sin ningún registro devuelve null',
  adherenceFromDoneDates(new Set(), null, '2026-01-01', '2026-01-03'), null);

t('adherencia: primer registro después del fin de la ventana devuelve null',
  adherenceFromDoneDates(new Set(['2026-01-15']), null, '2026-01-01', '2026-01-10'), null);

// ============================================================================
// spfScoreOf — protección UVA (ver FASE-B-matriz-activos.md §4)
// ============================================================================
group('🛡️ spfScoreOf');

t('spf: PA++++ y sello UVA UE puntúan igual',
  spfScoreOf({ tags: [{ cls: 'pa4' }] }),
  spfScoreOf({ tags: [{ cls: 'euuva' }] }));

t('spf: pa4 + euuva no se suman',
  spfScoreOf({ tags: [{ cls: 'pa4' }, { cls: 'euuva' }] }), 60);

t('spf: PA++++ solo', spfScoreOf({ tags: [{ cls: 'pa4' }] }), 60);
t('spf: PA+++ solo',  spfScoreOf({ tags: [{ cls: 'pa3' }] }), 43);
t('spf: PA++ solo',   spfScoreOf({ tags: [{ cls: 'pa2' }] }), 27);

t('spf: sin dato UVA', spfScoreOf({ tags: [] }), 21);
t('spf: tags cosméticos no puntúan',
  spfScoreOf({ tags: [{ cls: 'clear' }, { cls: 'best' }] }), 21);

t('spf: UVA400 sobre PA++++',        spfScoreOf({ tags: [{ cls: 'pa4' }, { cls: 'uva400' }] }), 90);
t('spf: UVA largos sobre PA++++',    spfScoreOf({ tags: [{ cls: 'pa4' }, { cls: 'uvalong' }] }), 75);
t('spf: uva400 y uvalong no se suman',
  spfScoreOf({ tags: [{ cls: 'pa4' }, { cls: 'uva400' }, { cls: 'uvalong' }] }), 90);

t('spf: tintado suma 10', spfScoreOf({ tags: [{ cls: 'pa4' }, { cls: 'tinted' }] }), 70);

t('spf: máximo 100',
  spfScoreOf({ tags: [{ cls: 'pa4' }, { cls: 'uva400' }, { cls: 'tinted' }] }), 100);

t('spf: Anthelios UV AIR (euuva+tinted)',
  spfScoreOf({ tags: [{ cls: 'euuva' }, { cls: 'tinted' }] }), 70);
t('spf: Nivea stick europeo (euuva)',
  spfScoreOf({ tags: [{ cls: 'euuva' }] }), 60);

// ============================================================================
// DOSIS POR EJE (Fase B) — ver FASE-B-matriz-activos.md §6
// ============================================================================
group('💊 doseWeekPct / overExposureDays');

t('dosis: el techo diario recorta el exceso',
  doseWeekPct([170, 0, 0, 0, 0, 0, 0], 85, 4),
  doseWeekPct([85, 0, 0, 0, 0, 0, 0], 85, 4));

t('dosis: 4 noches de retinoide = 100%',
  doseWeekPct([95, 0, 95, 0, 95, 0, 95], 85, 4), 100);

t('dosis: 7 noches no bajan el puntaje',
  doseWeekPct([95, 95, 95, 95, 95, 95, 95], 85, 4), 100);

t('dosis: aplicación libre diaria de barrera (el caso que motivó Fase B)',
  doseWeekPct([80, 80, 80, 80, 80, 80, 80], 100, 7), 80);

t('dosis: media semana = ~50%',
  doseWeekPct([90, 90, 90, 90, 0, 0, 0], 90, 7), 57);
t('dosis: sin aplicaciones = 0%',
  doseWeekPct([0, 0, 0, 0, 0, 0, 0], 90, 7), 0);

t('aviso: 4 noches de retinoide no avisa',
  overExposureDays([1, 0, 1, 0, 1, 0, 1], 4), 0);
t('aviso: 5 noches tolera 1 de margen',
  overExposureDays([1, 1, 1, 0, 1, 0, 1], 4), 0);
t('aviso: 7 noches dispara el aviso',
  overExposureDays([1, 1, 1, 1, 1, 1, 1], 4), 2);
t('aviso: textura alta sin irritantes no avisa',
  overExposureDays([0, 0, 0, 0, 0, 0, 0], 4), 0);

t('dosis: entrada inválida devuelve null', doseWeekPct(null, 85, 4), null);
t('dosis: sin config devuelve null', doseWeekPct([10], 0, 4), null);

// ============================================================================
// HIDRATACIÓN DE PALOMITAS — reglas 4 y 18 de ARQUITECTURA.md
// ============================================================================
group('💧 buildHydration / resolveStepHydration');

// Fixtures compartidos
const _CUT = 15; // AM_PM_CUTOFF_HOUR
const _prods = {
  'p-toner':  { id: 'p-toner',  category: '💦 Toners' },
  'p-spf':    { id: 'p-spf',    category: '🌞 SPF Facial' },
  'p-urea':   { id: 'p-urea',   category: '🦶 Pies' }
};

// ── PRIORIDAD 1: routine_step_id exacto ────────────────────────────────────
t('hidratación: el paso con routine_step_id se marca',
  resolveStepHydration(
    { id: 's1' },
    buildHydration([{ routine_step_id: 's1', product_name: '🌞 Anthelios', applied_at: '2026-07-20T09:00:00' }], _prods, _CUT),
    'am', '🌞 Anthelios'),
  '🌞 Anthelios');

t('hidratación: un paso distinto NO se marca',
  resolveStepHydration(
    { id: 's2' },
    buildHydration([{ routine_step_id: 's1', product_name: '🌞 Anthelios', applied_at: '2026-07-20T09:00:00' }], _prods, _CUT),
    'am', '🌞 Anthelios'),
  null);

// ── MULTI-PICKER: varias aplicaciones en un mismo paso se concatenan ────────
t('hidratación: multi-picker concatena nombres con " · "',
  resolveStepHydration(
    { id: 's1' },
    buildHydration([
      { routine_step_id: 's1', product_name: '💦 Toner A', applied_at: '2026-07-20T09:00:00' },
      { routine_step_id: 's1', product_name: '💦 Toner B', applied_at: '2026-07-20T09:05:00' }
    ], _prods, _CUT),
    'am', '💦 Toners'),
  '💦 Toner A · 💦 Toner B');

// ── REGLA 18: SEGMENTACIÓN POR SECCIÓN (el bug que motivó la regla) ─────────
// Un toner aplicado en la MAÑANA sin routine_step_id no debe marcar el paso
// "Toners" de la rutina de NOCHE, aunque compartan picker_category.
const _tonerAM = buildHydration(
  [{ product_id: 'p-toner', product_name: '💦 Toner A', applied_at: '2026-07-20T09:00:00' }],
  _prods, _CUT);

t('regla 18: toner de la mañana SÍ marca el paso AM',
  resolveStepHydration({ id: 'sAM', picker_category: '💦 Toners' }, _tonerAM, 'am', '💦 Toners'),
  '💦 Toner A');

t('regla 18: toner de la mañana NO marca el paso PM (era el bug)',
  resolveStepHydration({ id: 'sPM', picker_category: '💦 Toners' }, _tonerAM, 'pm', '💦 Toners'),
  null);

const _tonerPM = buildHydration(
  [{ product_id: 'p-toner', product_name: '💦 Toner A', applied_at: '2026-07-20T20:00:00' }],
  _prods, _CUT);

t('regla 18: toner de la noche marca PM y no AM',
  [resolveStepHydration({ id: 'x', picker_category: '💦 Toners' }, _tonerPM, 'pm', '💦 Toners'),
   resolveStepHydration({ id: 'y', picker_category: '💦 Toners' }, _tonerPM, 'am', '💦 Toners')],
  ['💦 Toner A', null]);

t('corte AM/PM: las 15:00 en punto ya cuentan como PM',
  [resolveStepHydration({ id: 'x', picker_category: '💦 Toners' },
     buildHydration([{ product_id: 'p-toner', product_name: '💦 T', applied_at: '2026-07-20T15:00:00' }], _prods, _CUT),
     'pm', '💦 Toners'),
   resolveStepHydration({ id: 'x', picker_category: '💦 Toners' },
     buildHydration([{ product_id: 'p-toner', product_name: '💦 T', applied_at: '2026-07-20T14:59:00' }], _prods, _CUT),
     'am', '💦 Toners')],
  ['💦 T', '💦 T']);

// ── CUERPO Y PIES: siempre matchean, sin importar la hora ──────────────────
t('cuerpo/pies: un registro de la mañana marca el paso de pies igual',
  resolveStepHydration(
    { id: 'sf', picker_category: '🦶 Pies' },
    buildHydration([{ product_id: 'p-urea', product_name: '🦶 Urea 40%', applied_at: '2026-07-20T09:00:00' }], _prods, _CUT),
    'feet', '🦶 Pies'),
  '🦶 Urea 40%');

// ── PRIORIDAD 2: product_id ────────────────────────────────────────────────
t('hidratación: paso fijo se marca por product_id',
  resolveStepHydration(
    { id: 's9', product_id: 'p-spf' },
    buildHydration([{ product_id: 'p-spf', product_name: '🌞 Anthelios', applied_at: '2026-07-20T09:00:00' }], _prods, _CUT),
    'am', '🌞 Anthelios'),
  '🌞 Anthelios');

// ── PRIORIDAD 4: nombre, SOLO para pasos informativos ──────────────────────
// Es lo que hace que "Agua Tibia" siga palomeado después de recargar.
t('informativo: un paso sin product_id ni picker_category se marca por nombre',
  resolveStepHydration(
    { id: 'si' },
    buildHydration([{ product_name: '📝 Agua Tibia, no caliente', applied_at: '2026-07-20T08:00:00' }], _prods, _CUT),
    'body', '📝 Agua Tibia, no caliente'),
  '📝 Agua Tibia, no caliente');

t('un paso CON picker_category no cae al fallback por nombre',
  resolveStepHydration(
    { id: 'sp', picker_category: '💦 Toners' },
    buildHydration([{ product_name: '💦 Toners', applied_at: '2026-07-20T09:00:00' }], _prods, _CUT),
    'am', '💦 Toners'),
  null);

// ── BORDES ─────────────────────────────────────────────────────────────────
t('hidratación: día sin registros no marca nada',
  resolveStepHydration({ id: 's1', picker_category: '💦 Toners' },
    buildHydration([], _prods, _CUT), 'am', '💦 Toners'),
  null);

t('hidratación: entradas nulas no truenan',
  [resolveStepHydration(null, buildHydration([], {}, _CUT), 'am', ''),
   resolveStepHydration({ id: 's' }, null, 'am', '')],
  [null, null]);

t('hidratación: producto sin categoría no rompe el índice',
  resolveStepHydration(
    { id: 's', product_id: 'p-desconocido' },
    buildHydration([{ product_id: 'p-desconocido', product_name: '🧴 X', applied_at: '2026-07-20T09:00:00' }], _prods, _CUT),
    'am', '🧴 X'),
  '🧴 X');

// ── ORIGEN DE LA APLICACIÓN: una reaplicación NO marca pasos de rutina ─────
const _appReap = { product_id: 'p-spf', product_name: '🌞 Anthelios',
                   applied_at: '2026-07-20T14:00:00', source: 'reaplicacion' };
const _stepSpf = { id: 'sSPF', product_id: 'p-spf' };
const _stepCat = { id: 'sCat', picker_category: '🌞 SPF Facial' };

t('reaplicación NO marca el paso fijo del mismo producto',
  resolveStepHydration(_stepSpf, buildHydration([_appReap], _prods, _CUT), 'am', '🌞 Anthelios'),
  null);

t('reaplicación NO marca el paso por categoría',
  resolveStepHydration(_stepCat, buildHydration([_appReap], _prods, _CUT), 'am', '🌞 SPF Facial'),
  null);

t('reaplicación con routine_step_id SÍ marca (se eligió desde el paso)',
  resolveStepHydration({ id: 'sX' },
    buildHydration([{ ...(_appReap), routine_step_id: 'sX' }], _prods, _CUT), 'am', '🌞 Anthelios'),
  '🌞 Anthelios');

t('un registro de rutina sin step id sigue hidratando (dato viejo)',
  resolveStepHydration(_stepSpf,
    buildHydration([{ ..._appReap, source: 'rutina' }], _prods, _CUT), 'am', '🌞 Anthelios'),
  '🌞 Anthelios');

t('un registro sin source (anterior al cambio) sigue hidratando',
  resolveStepHydration(_stepSpf,
    buildHydration([{ ..._appReap, source: null }], _prods, _CUT), 'am', '🌞 Anthelios'),
  '🌞 Anthelios');

t('rutina y reaplicación el mismo día: gana la de rutina, no se anulan',
  resolveStepHydration(_stepSpf, buildHydration([
    { ..._appReap, source: 'rutina', product_name: '🌞 De rutina' },
    _appReap
  ], _prods, _CUT), 'am', '🌞 Anthelios'),
  '🌞 De rutina');

t('reaplicación de cuerpo tampoco marca el paso de cuerpo',
  resolveStepHydration({ id: 'sB', picker_category: '🦶 Pies' },
    buildHydration([{ product_id: 'p-urea', product_name: '🦶 Urea',
                      applied_at: '2026-07-20T09:00:00', source: 'reaplicacion' }], _prods, _CUT),
    'feet', '🦶 Pies'),
  null);

// ============================================================================
// REACCIÓN A PRODUCTO NUEVO — coincidencia temporal, NO causa
// ============================================================================
group('🔬 reactionSignal');

// Helper: llena un rango de fechas con el mismo valor de piel.
const _skin = (desde, dias, val, base) => {
  const o = base || {};
  for (let i = 0; i < dias; i++) o[shiftDateStr(desde, i)] = val;
  return o;
};

t('shiftDateStr: suma días',        shiftDateStr('2026-01-15', 5), '2026-01-20');
t('shiftDateStr: resta días',       shiftDateStr('2026-01-15', -5), '2026-01-10');
t('shiftDateStr: cruza fin de mes', shiftDateStr('2026-01-31', 1), '2026-02-01');
t('shiftDateStr: cruza fin de año', shiftDateStr('2025-12-31', 1), '2026-01-01');
t('shiftDateStr: año bisiesto',     shiftDateStr('2028-02-28', 1), '2028-02-29');

// Piel en 4/5 los 14 días previos, en 2/5 los 14 siguientes.
const empeora = _skin('2026-01-15', 14, 2, _skin('2026-01-01', 14, 4));
t('detecta empeoramiento tras introducir el producto',
  (r => [r.direction, r.before, r.after, r.delta])(reactionSignal('2026-01-15', empeora)),
  ['peor', 4, 2, -2]);

const mejora = _skin('2026-01-15', 14, 4.5, _skin('2026-01-01', 14, 3));
t('detecta mejoría también (no solo lo malo)',
  reactionSignal('2026-01-15', mejora).direction, 'mejor');

t('sin cambio relevante devuelve null',
  reactionSignal('2026-01-15', _skin('2026-01-15', 14, 4, _skin('2026-01-01', 14, 4))), null);

t('un cambio por debajo del umbral no reporta',
  reactionSignal('2026-01-15', _skin('2026-01-15', 14, 3.5, _skin('2026-01-01', 14, 4))), null);

// ── EVIDENCIA INSUFICIENTE: lo que evita las falsas alarmas ────────────────
t('con pocos días ANTES no concluye nada',
  reactionSignal('2026-01-15', _skin('2026-01-15', 14, 2, _skin('2026-01-13', 2, 4))), null);

t('con pocos días DESPUÉS no concluye nada',
  reactionSignal('2026-01-15', _skin('2026-01-15', 2, 2, _skin('2026-01-01', 14, 4))), null);

t('sin ningún registro de piel devuelve null',
  reactionSignal('2026-01-15', {}), null);

t('sin fecha de inicio devuelve null',
  reactionSignal(null, empeora), null);

t('cuenta solo los días CON registro, no el rango completo',
  (r => [r.nBefore, r.nAfter])(reactionSignal('2026-01-15', empeora)), [14, 14]);

t('el día de inicio cuenta como DESPUÉS',
  (r => r.nAfter)(reactionSignal('2026-01-15',
    _skin('2026-01-15', 4, 1, _skin('2026-01-01', 14, 5)))), 4);

t('ventana y umbral configurables',
  (r => [r.nBefore, r.nAfter])(reactionSignal('2026-01-15',
    _skin('2026-01-15', 7, 2, _skin('2026-01-08', 7, 4)), { windowDays: 7 })), [7, 7]);


group('🎯 spotTrend');

// `shade` es apreciación visual de la usuaria (1 = casi no se ve, 5 = muy
// marcada), NO una medición. La tendencia se lee como dirección, no como
// cuánto aclaró.
t('spotTrend: con una sola observación no concluye',
  spotTrend([{ observed_at: '2026-01-01', shade: 4 }]), null);
t('spotTrend: sin observaciones devuelve null', spotTrend([]), null);
t('spotTrend: entrada nula no truena', spotTrend(null), null);

t('spotTrend: detecta aclaramiento entre la primera y la última',
  (r => [r.direction, r.first, r.last, r.delta, r.n])(spotTrend([
    { observed_at: '2026-01-01', shade: 5 }, { observed_at: '2026-04-01', shade: 3 }])),
  ['aclarando', 5, 3, -2, 2]);

t('spotTrend: detecta oscurecimiento',
  spotTrend([{ observed_at: '2026-01-01', shade: 2 },
             { observed_at: '2026-03-01', shade: 4 }]).direction, 'oscureciendo');

t('spotTrend: sin cambio dice "igual"',
  spotTrend([{ observed_at: '2026-01-01', shade: 3 },
             { observed_at: '2026-03-01', shade: 3 }]).direction, 'igual');

t('spotTrend: ordena aunque lleguen desordenadas',
  (r => [r.first, r.last])(spotTrend([
    { observed_at: '2026-04-01', shade: 2 }, { observed_at: '2026-01-01', shade: 5 },
    { observed_at: '2026-02-01', shade: 4 }])), [5, 2]);

t('spotTrend: cuenta los días entre la primera y la última',
  spotTrend([{ observed_at: '2026-01-01', shade: 5 },
             { observed_at: '2026-01-31', shade: 4 }]).days, 30);

t('spotTrend: ignora observaciones sin shade',
  spotTrend([{ observed_at: '2026-01-01', shade: 5 }, { observed_at: '2026-02-01', shade: null },
             { observed_at: '2026-03-01', shade: 3 }]).n, 2);

t('spotTrend: si solo queda una válida, no concluye',
  spotTrend([{ observed_at: '2026-01-01', shade: 5 },
             { observed_at: '2026-02-01', shade: null }]), null);

// ── fin ──
finish();
</script>
